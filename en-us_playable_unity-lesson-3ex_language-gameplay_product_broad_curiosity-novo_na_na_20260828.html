html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:rgba(0,0,0,0);font-family:'DuolingoSans',-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#stage{position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;touch-action:manipulation}
#topbar{width:88%;max-width:520px;margin-top:4.5%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
#pbar{-webkit-flex:1;flex:1;height:14px;background:#E5E5E5;border-radius:8px;overflow:hidden}
#pfill{width:5%;height:100%;background:#58CC02;border-radius:8px;-webkit-transition:width .5s ease;transition:width .5s ease}
#qwrap{width:88%;max-width:520px;-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;min-height:0}
#promptrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:4%}
#owl{height:64px;width:auto;-webkit-flex-shrink:0;flex-shrink:0}
#bubble{position:relative;margin-left:14px;background:#fff;border:2px solid #E5E5E5;border-radius:14px;padding:10px 14px;color:#4B4B4B;font-size:16px;font-weight:700}
#bubble:before{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;width:12px;height:12px;background:#fff;border-left:2px solid #E5E5E5;border-bottom:2px solid #E5E5E5;-webkit-transform:rotate(45deg);transform:rotate(45deg)}
.screen{display:none}
.screen.on{display:block}
.qtitle{color:#4B4B4B;font-size:19px;font-weight:800;margin:0 0 4% 0}
.choice{position:relative;display:block;width:100%;box-sizing:border-box;margin:5px 0;padding:14px 16px;background:#fff;border:2px solid #E5E5E5;border-bottom-width:4px;border-radius:14px;color:#4B4B4B;font-size:18px;font-weight:700;text-align:left;cursor:pointer}
.choice .num{display:inline-block;width:26px;height:26px;line-height:24px;text-align:center;border:2px solid #E5E5E5;border-radius:8px;color:#AFAFAF;font-size:14px;font-weight:700;margin-right:12px;box-sizing:border-box}
.choice.correct{background:#D7FFB8;border-color:#58CC02;color:#58A700}
.choice.correct .num{border-color:#58CC02;color:#58A700}
.choice.wrong{background:#FFDFE0;border-color:#FF4B4B;color:#EA2B2B}
.choice.wrong .num{border-color:#FF4B4B;color:#EA2B2B}
.choice.dim{opacity:.45}
#pairs{display:-webkit-flex;display:flex;margin:0 -5px}
.pcol{-webkit-flex:1;flex:1;margin:0 5px}
.pair{display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:13px 8px;background:#fff;border:2px solid #E5E5E5;border-bottom-width:4px;border-radius:14px;color:#4B4B4B;font-size:16px;font-weight:700;text-align:center;cursor:pointer}
.pair.sel{border-color:#1CB0F6;background:#DDF4FF;color:#1899D6}
.pair.lock{background:#D7FFB8;border-color:#58CC02;color:#58A700;opacity:.55;pointer-events:none}
.pair.no{background:#FFDFE0;border-color:#FF4B4B;color:#EA2B2B}

.bounce{-webkit-animation:bounce .95s ease-in-out infinite;animation:bounce .95s ease-in-out infinite}

}

<script>
(function(){
"use strict";
var STORE_URLS={Android:"https://play.google.com/store/apps/details?id=com.duolingo",iOS:"https://apps.apple.com/app/duolingo-language-lessons/id570060128"};
var IS_IOS=/iP(hone|od|ad)/.test(navigator.userAgent);
var started=false,AC=null,step=0;

function openStore(){var u=IS_IOS?STORE_URLS.iOS:STORE_URLS.Android;if(window.mraid&&mraid.open){mraid.open(u);}}

function ding(ok){
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    if(!AC)AC=new Ctx();
    if(AC.state==="suspended"&&AC.resume)AC.resume();
    var t=AC.currentTime,f=ok?[659.25,880]:[311.13,233.08],i;
    for(i=0;i<f.length;i++){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type="sine";o.frequency.value=f[i];
      g.gain.setValueAtTime(0.0001,t+i*0.12);
      g.gain.exponentialRampToValueAtTime(0.18,t+i*0.12+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.12+0.25);
      o.connect(g);g.connect(AC.destination);
      o.start(t+i*0.12);o.stop(t+i*0.12+0.3);
    }
  }catch(e){}
}

function confetti(x,y){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var colors=["#58CC02","#1CB0F6","#FFC800","#FF4B4B","#CE82FF"],i;
  for(i=0;i<14;i++){
    var d=document.createElement("div");
    d.className="confetti";
    d.style.background=colors[i%colors.length];
    d.style.left=(x+(Math.random()*120-60))+"px";
    d.style.top=(y+(Math.random()*30-15))+"px";
    document.body.appendChild(d);
    d.className="confetti go";
    (function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},1100);})(d);
  }
}

function loseHeart(){}
function setProgress(pct){document.getElementById("pfill").style.width=pct+"%";}
function setBubble(t){document.getElementById("bubble").textContent=t;}

function goto2(){
  step=1;setProgress(50);setBubble("Match the words");
  document.getElementById("ex1").className="screen";
  document.getElementById("ex2").className="screen on";
}
function finish(){
  setProgress(100);ding(true);
  var r=document.getElementById("qwrap").getBoundingClientRect();
  confetti(r.left+r.width/2,r.top+r.height/2);
  setTimeout(function(){document.getElementById("endcard").className="show";},900);
}

/* ---- Exercise 1: select translation ---- */
var e1done=false;
function onChoice(ev){
  if(!started||e1done||step!==0)return;
  var el=ev.currentTarget,ok=el.getAttribute("data-ok")==="1";
  var all=document.querySelectorAll("#ex1 .choice"),i;
  if(ok){
    e1done=true;
    for(i=0;i<all.length;i++){if(all[i]!==el)all[i].className="choice dim";}
    el.className="choice correct";
    ding(true);setProgress(33);
    setTimeout(goto2,900);
  }else{
    el.className="choice wrong";
    ding(false);loseHeart();
    (function(b){setTimeout(function(){b.className="choice";},700);})(el);
  }
}

/* ---- Exercise 2: match pairs ---- */
var PAIRS=[["cat","gato"],["milk","leche"],["bread","pan"],["water","agua"]];
var R_ORDER=[2,0,3,1];
var selL=-1,locked=0,busy=false;
function buildPairs(){
  var L=document.getElementById("pcolL"),R=document.getElementById("pcolR"),i;
  for(i=0;i<PAIRS.length;i++){
    var b=document.createElement("button");
    b.className="pair";b.textContent=PAIRS[i][0];
    b.setAttribute("data-i",i);b.setAttribute("data-side","L");
    L.appendChild(b);b.addEventListener("click",onPair,false);
  }
  for(i=0;i<R_ORDER.length;i++){
    var c=document.createElement("button");
    c.className="pair";c.textContent=PAIRS[R_ORDER[i]][1];
    c.setAttribute("data-i",R_ORDER[i]);c.setAttribute("data-side","R");
    R.appendChild(c);c.addEventListener("click",onPair,false);
  }
}
function onPair(ev){
  if(!started||step!==1||busy)return;
  var el=ev.currentTarget,side=el.getAttribute("data-side"),idx=parseInt(el.getAttribute("data-i"),10);
  if(side==="L"){
    var Ls=document.querySelectorAll('#pcolL .pair'),i;
    for(i=0;i<Ls.length;i++){if(Ls[i].className==="pair sel")Ls[i].className="pair";}
    el.className="pair sel";selL=idx;
    return;
  }
  if(selL<0)return;
  var lBtn=document.querySelector('#pcolL .pair[data-i="'+selL+'"]');
  if(idx===selL){
    el.className="pair lock";if(lBtn)lBtn.className="pair lock";
    selL=-1;locked++;ding(true);
    if(locked>=PAIRS.length){setTimeout(finish,800);}
  }else{
    busy=true;
    el.className="pair no";if(lBtn)lBtn.className="pair no";
    ding(false);loseHeart();
    setTimeout(function(){
      el.className="pair";if(lBtn)lBtn.className="pair";
      selL=-1;busy=false;
    },650);
  }
}

function bind(){
  var all=document.querySelectorAll("#ex1 .choice"),i;
  for(i=0;i<all.length;i++){all[i].addEventListener("click",onChoice,false);}
  buildPairs();
  document.getElementById("cta").addEventListener("click",openStore,false);
  document.getElementById("minicta").addEventListener("click",openStore,false);
}

function showAd(){started=true;document.body.className="";}
function resumeAd(){document.body.className="";if(AC&&AC.resume)AC.resume();}
function pauseAd(){document.body.className="paused";if(AC&&AC.suspend)AC.suspend();}

function onViewableChange(v){if(v){started?resumeAd():showAd();}else{pauseAd();}}
function onSdkReady(){mraid.addEventListener("viewableChange",onViewableChange);if(mraid.isViewable())showAd();}
function start(){
  bind();
  if(window.mraid){
    if(mraid.getState()==="loading"){mraid.addEventListener("ready",onSdkReady);}
    else{onSdkReady();}
  }
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){pauseAd();}
  else if(!window.mraid||mraid.isViewable()){if(started)resumeAd();}
},false);
start();
})();
</script>
